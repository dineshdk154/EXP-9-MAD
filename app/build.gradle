/*
 * App module build file.
 * - Non-Compose (XML + AppCompat)
 * - Minimal dependencies for a simple calculator
 */
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.example.simplecalculator"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.simplecalculator"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Keep the default runner for future instrumentation tests (step 2 in plan).
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // For this educational sample, keep it simple.
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        // Using findViewById (no view binding required), keep features minimal.
        viewBinding false
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
}
